[project]
name = "walkie-server"
version = "0.1.0"
description = "Server LAN per Web Walkie-Talkie: file statici HTTPS + broker MQTT su WebSocket"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14",
    "loguru>=0.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cryptography>=42",
]

[project.scripts]
walkie-server = "walkie_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/walkie_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
